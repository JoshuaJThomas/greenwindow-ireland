[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "greenwindow-ireland"
version = "0.2.0"
description = "48-hour carbon-intensity forecasts for the Irish grid from a 1.6M-parameter PatchTST distilled from Chronos-Bolt, and the cleanest 3-hour window."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Joshua Thomas" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
    "torch>=2.2",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
app = ["streamlit>=1.35", "plotly>=5.20"]
dev = [
    "greenwindow-ireland[serve,onnx]",
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
greenwindow = "greenwindow.cli:main"

[project.urls]
Portfolio = "https://joshuajthomas.github.io/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["greenwindow*"]     # src/models and src/analysis are legacy shims

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the live EirGrid API (deselected by default)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP007", "UP038"]
